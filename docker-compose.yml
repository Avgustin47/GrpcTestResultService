services:
#микросервис для авторизации пользователей
  grpcautharizationtservice:
    image: ${DOCKER_REGISTRY-}grpcautharizationservice
    build:
      context: .
      dockerfile: GrpcAutthorizationService/Dockerfile
    ports:
      - "5002:8080"
    container_name: "my_grpc_auth_service"
    depends_on:
      - usersdb
      - rabbitmq
    environment:
      - RabbitMQ__Host=amqp://rabbitmq:5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
    healthcheck:
      test: ["CMD", "wget", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - grpc-network
#микросервис нотификации 
  notification-service:
    image: ${DOCKER_REGISTRY-}notificationservice
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    ports:
      - "5003:8080"
    container_name: notification_service
    depends_on:
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=amqp://rabbitmq:5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
      - Smtp__Host=smtp.yourprovider.com
      - Smtp__Port=587
      - Smtp__Username=user
      - Smtp__Password=pass
    networks:
      - grpc-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
#микросервис для результатов анализов
  grpctestresultservice:
    image: ${DOCKER_REGISTRY-}grpctestresultservice
    build:
      context: .
      dockerfile: GrpcTestResultService/Dockerfile
    ports:
      - "5000:8080"
    container_name: "my_grpc_service"
    depends_on:
      - redis
      - db
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=amqp://rabbitmq:5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
      - Redis__ConnectionString=redis:6379,password=qwerty,defaultDatabase=0
      - Redis__InstanceName=TestResultServuce
      - Redis__Enabled=true
      - Serilog__MinimumLevel__Default=Information
    volumes:
      - ./logs/order-api:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3 
    networks:
      - grpc-network
#микросервис генерации отчетов
  grpcpdfservice:
    image: ${DOCKER_REGISTRY-}grpcprdfservice
    build:
      context: .
      dockerfile: GrpcPdfService/Dockerfile
    ports:
      - "5001:8080"
    container_name: "my_grpcpdf_service"
    depends_on:
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=amqp://rabbitmq:5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
    healthcheck:
      test: ["CMD", "wget", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - grpc-network
#брокер для передачи сообщений между микросервисами
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - grpc-network

    
#редис для кэширования
  redis:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
    environment: 
      - REDIS_ARGS=--appendonly yes --requirepass qwerty
    command: >
      redis-server
      --appendonly yes
      --requirepass qwerty
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000 
    volumes:
      - ./redis-data:/data  
    networks:
      - grpc-network
   #база данных для медицинскийх тестов
  db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: mydb
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5431:5432"
    networks:
      - grpc-network
#база данных для пользователей
  usersdb:
    image: postgres:latest
    container_name: postgres_userdb
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: myuserdb
      PGDATA: /var/lib/postgresql/dataforusers
    volumes:
      - postgres_userdata:/var/lib/postgresql
    ports:
      - "2288:5432"
    networks:
      - grpc-network
#база данных для отчетов
  reportdb:
    image: postgres:latest
    container_name: postgres_reportsdb
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: reportdb
      PGDATA: /var/lib/postgresql/dataforusers
    volumes:
      - postgres_reportdata:/var/lib/postgresql
    ports:
      - "1234:5432"
    networks:
      - grpc-network
volumes:
  postgres_data:
  postgres_userdata:
  postgres_reportdata:
networks:
  grpc-network:
    driver: bridge