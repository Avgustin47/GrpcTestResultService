syntax = "proto3";

option csharp_namespace = "GrpcAutthorizationService.Protos";

message RegisterRequest {

	string email= 1;
	string password = 2;
	string fullname =3;

}
message RegisterRespone {
 bool succes = 1;
 string user_id = 2;
 string message = 3;

}
message LoginRequest{
 string email =1;
 string password = 2;
  string role = 3;
}

message LoginResponce
{
 bool succes = 1;
 string access_token=2;
 string	refresh_token = 3;
 string user_id = 4;
 string message =5;

}


message RefreshTokenRequest
{
 string refresh_token = 1;
 string role = 2;
}


message RefreshTokenResponce{
 bool succes =1;
 string access_token=2;
 string refresh_token = 3;
 string message = 4;
}

service AuthService
{
	rpc Register (RegisterRequest) returns (RegisterRespone);
	rpc Login (LoginRequest) returns (LoginResponce);
	rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponce);

}